<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190e2e"/>
      <stop offset="100%" stop-color="#11091f"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221240"/>
      <stop offset="100%" stop-color="#351b60"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="420" height="340" rx="14" fill="url(#cardBg2)" stroke="#4c2d73" stroke-width="1.5"/>

  <!-- Top Art Area -->
  <rect x="12" y="12" width="396" height="148" rx="10" fill="url(#sky2)"/>
  <!-- Moon -->
  <circle cx="362" cy="48" r="18" fill="#e9d5ff" opacity="0.2"/>
  <circle cx="362" cy="48" r="12" fill="#f3e8ff" opacity="0.85"/>
  <!-- Skyline -->
  <path d="M 12 160 L 12 132 L 36 132 L 36 118 L 62 118 L 62 138 L 90 138 L 90 124 L 120 124 L 120 144 L 300 144 L 300 120 L 328 120 L 328 136 L 354 136 L 354 114 L 382 114 L 382 132 L 408 132 L 408 160 Z" fill="#120922" opacity="0.8"/>
  <!-- Project Badge -->
  <rect x="24" y="24" width="94" height="22" rx="6" fill="#170d29" stroke="#6d3eb5" stroke-width="1"/>
  <text x="71" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#d8b4fe">PROJECT / 02</text>

  <!-- Center Illustration: Grid / Dots Architecture -->
  <g transform="translate(148, 42)">
    <rect x="0" y="0" width="124" height="82" rx="8" fill="#140b26" stroke="#7c3aed" stroke-width="1.5"/>
    <g fill="#c084fc">
      <circle cx="26" cy="24" r="4"/>
      <circle cx="50" cy="24" r="4"/>
      <circle cx="74" cy="24" r="4"/>
      <circle cx="98" cy="24" r="4"/>
      <circle cx="26" cy="42" r="4"/>
      <circle cx="50" cy="42" r="4" fill="#e9d5ff"/>
      <circle cx="74" cy="42" r="4" fill="#e9d5ff"/>
      <circle cx="98" cy="42" r="4"/>
      <circle cx="26" cy="60" r="4"/>
      <circle cx="50" cy="60" r="4"/>
      <circle cx="74" cy="60" r="4"/>
      <circle cx="98" cy="60" r="4"/>
    </g>
    <line x1="50" y1="42" x2="74" y2="42" stroke="#e9d5ff" stroke-width="2"/>
    <line x1="50" y1="24" x2="50" y2="42" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Content Area -->
  <text x="24" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">House of Dots</text>
  <text x="24" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#a78bfa" letter-spacing="0.8">TYPESCRIPT • WEB APPLICATION</text>

  <text x="24" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Interactive TypeScript project focused on clean</text>
  <text x="24" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">UI architecture and responsive front-end design.</text>

  <!-- Tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#d8b4fe">
    <rect x="24" y="274" width="84" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="66" y="287.5" text-anchor="middle">TYPESCRIPT</text>
    <rect x="116" y="274" width="58" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="145" y="287.5" text-anchor="middle">UI/UX</text>
    <rect x="182" y="274" width="52" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="208" y="287.5" text-anchor="middle">WEB</text>
  </g>

  <!-- Button -->
  <rect x="24" y="304" width="136" height="24" rx="6" fill="#7c3aed"/>
  <text x="92" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">View repository ↗</text>

  <!-- Right Icon Pills -->
  <rect x="348" y="304" width="24" height="24" rx="6" fill="#23143d" stroke="#4c2d73" stroke-width="1"/>
