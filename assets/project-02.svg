  <rect x="378" y="304" width="24" height="24" rx="6" fill="#23143d" stroke="#4c2d73" stroke-width="1"/>
  <text x="390" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">↗</text>
