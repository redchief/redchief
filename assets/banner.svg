    <text x="684" y="155" text-anchor="middle">⚡ Full-Stack</text>
  </g>

  <!-- Tech Pills Row -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#d8b4fe">
    <rect x="218" y="182" width="76" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
    <text x="256" y="197.5" text-anchor="middle">Lean 4</text>

    <rect x="304" y="182" width="66" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
    <text x="337" y="197.5" text-anchor="middle">Rust</text>

    <rect x="380" y="182" width="54" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
    <text x="407" y="197.5" text-anchor="middle">C/C++</text>

    <rect x="444" y="182" width="96" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
    <text x="492" y="197.5" text-anchor="middle">TypeScript</text>

    <rect x="550" y="182" width="72" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
    <text x="586" y="197.5" text-anchor="middle">Python</text>

    <rect x="632" y="182" width="60" height="23" rx="5" fill="#170d29" stroke="#4c2d73" stroke-width="1"/>
