<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c24"/>
      <stop offset="55%" stop-color="#1e1136"/>
      <stop offset="100%" stop-color="#2c164d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="16" fill="url(#sky)" stroke="#4c2d73" stroke-width="2"/>

  <!-- Stars -->
  <g fill="#e9d5ff" opacity="0.65">
    <circle cx="85" cy="42" r="1.4"/>
    <circle cx="145" cy="28" r="1"/>
    <circle cx="230" cy="48" r="1.2"/>
    <circle cx="315" cy="26" r="1"/>
    <circle cx="595" cy="34" r="1.3"/>
    <circle cx="670" cy="52" r="1"/>
    <circle cx="725" cy="28" r="1.5"/>
    <circle cx="845" cy="75" r="1.2"/>
    <circle cx="70" cy="95" r="1"/>
    <circle cx="820" cy="120" r="1"/>
  </g>

  <!-- Crescent Moon & Glow -->
  <circle cx="790" cy="65" r="46" fill="url(#moonGlow)"/>
  <path d="M 796 39 A 24 24 0 1 0 815 74 A 19 19 0 1 1 796 39 Z" fill="#f3e8ff" opacity="0.9"/>

  <!-- Clouds -->
  <ellipse cx="735" cy="68" rx="48" ry="11" fill="#3b1f63" opacity="0.55"/>
  <ellipse cx="205" cy="72" rx="56" ry="10" fill="#3b1f63" opacity="0.4"/>

  <!-- Night City Skyline Silhouette -->
  <path d="
    M 10 258 L 10 212 L 28 212 L 28 190 L 52 190 L 52 216 L 68 216 L 68 176 L 96 176 L 96 206
    L 116 206 L 116 196 L 140 196 L 140 222 L 164 222 L 164 185 L 188 185 L 188 214 L 214 214
    L 214 198 L 240 198 L 240 220 L 270 220 L 270 202 L 296 202 L 296 226 L 330 226 L 330 208
    L 360 208 L 360 228 L 540 228 L 540 206 L 568 206 L 568 222 L 598 222 L 598 194 L 626 194
    L 626 218 L 652 218 L 652 184 L 682 184 L 682 210 L 708 210 L 708 172 L 738 172 L 738 205
    L 764 205 L 764 188 L 792 188 L 792 216 L 818 216 L 818 178 L 848 178 L 848 210 L 890 210 L 890 258 Z"
    fill="#10081c" opacity="0.88"/>

  <!-- Lit City Windows -->
  <g fill="#a855f7" opacity="0.45">
    <rect x="74" y="186" width="5" height="6" rx="1"/>
    <rect x="84" y="186" width="5" height="6" rx="1"/>
    <rect x="74" y="198" width="5" height="6" rx="1"/>
    <rect x="170" y="195" width="5" height="6" rx="1"/>
    <rect x="170" y="207" width="5" height="6" rx="1"/>
    <rect x="658" y="194" width="5" height="6" rx="1"/>
    <rect x="668" y="194" width="5" height="6" rx="1"/>
    <rect x="715" y="182" width="5" height="6" rx="1"/>
    <rect x="725" y="182" width="5" height="6" rx="1"/>
    <rect x="715" y="194" width="5" height="6" rx="1"/>
    <rect x="826" y="188" width="5" height="6" rx="1"/>
    <rect x="836" y="188" width="5" height="6" rx="1"/>
  </g>

  <!-- Terminal Greeting -->
  <text x="342" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#a78bfa" letter-spacing="0.8">&gt; hello_world();</text>

  <!-- Main Name Title -->
  <rect x="292" y="68" width="4" height="34" rx="2" fill="url(#accentBar)"/>
  <text x="308" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2.2">JAYSHEEL VIJAY</text>

  <!-- Subtitle -->
  <text x="450" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#c4b5fd" letter-spacing="2.4">SYSTEMS  •  MOBILE LINUX  •  FORMAL VERIFICATION</text>

  <!-- Focus Pills Row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e9d5ff">
    <rect x="148" y="138" width="150" height="26" rx="6" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="223" y="155" text-anchor="middle">&lt;/&gt; Systems &amp; Kernels</text>

    <rect x="308" y="138" width="152" height="26" rx="6" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="384" y="155" text-anchor="middle">λ Formal Proofs</text>

    <rect x="470" y="138" width="136" height="26" rx="6" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
