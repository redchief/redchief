<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190e2e"/>
      <stop offset="100%" stop-color="#11091f"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221240"/>
      <stop offset="100%" stop-color="#351b60"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="420" height="340" rx="14" fill="url(#cardBg)" stroke="#4c2d73" stroke-width="1.5"/>

  <!-- Top Art Area -->
  <rect x="12" y="12" width="396" height="148" rx="10" fill="url(#sky1)"/>
  <!-- Moon -->
  <circle cx="362" cy="48" r="18" fill="#e9d5ff" opacity="0.2"/>
  <circle cx="362" cy="48" r="12" fill="#f3e8ff" opacity="0.85"/>
  <!-- Skyline -->
  <path d="M 12 160 L 12 132 L 36 132 L 36 118 L 62 118 L 62 138 L 90 138 L 90 124 L 120 124 L 120 144 L 300 144 L 300 120 L 328 120 L 328 136 L 354 136 L 354 114 L 382 114 L 382 132 L 408 132 L 408 160 Z" fill="#120922" opacity="0.8"/>
  <!-- Project Badge -->
  <rect x="24" y="24" width="94" height="22" rx="6" fill="#170d29" stroke="#6d3eb5" stroke-width="1"/>
  <text x="71" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#d8b4fe">PROJECT / 01</text>

  <!-- Center Illustration: Formal Proof / Circuit Node -->
  <g transform="translate(148, 42)">
    <rect x="0" y="0" width="124" height="82" rx="8" fill="#140b26" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="12" y1="20" x2="54" y2="20" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="36" x2="92" y2="36" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="52" x2="76" y2="52" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="68" x2="48" y2="68" stroke="#6d3eb5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="96" cy="24" r="14" fill="#2e1754" stroke="#c084fc" stroke-width="1.5"/>
    <text x="96" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f3e8ff">λ</text>
  </g>

  <!-- Content Area -->
  <text x="24" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">P vs NP — Lean 4 Proofs</text>
  <text x="24" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#a78bfa" letter-spacing="0.8">LEAN 4 • FORMAL VERIFICATION</text>

  <text x="24" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Machine-checked Lean 4 proof reductions and circuit</text>
  <text x="24" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">lower-bound decompositions for pequalnp.com.</text>

  <!-- Tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#d8b4fe">
    <rect x="24" y="274" width="56" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="52" y="287.5" text-anchor="middle">LEAN 4</text>
    <rect x="88" y="274" width="68" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="122" y="287.5" text-anchor="middle">MATHLIB</text>
    <rect x="164" y="274" width="44" height="20" rx="5" fill="#23143d" stroke="#5b3491" stroke-width="1"/>
    <text x="186" y="287.5" text-anchor="middle">Z3</text>
  </g>

  <!-- Button -->
  <rect x="24" y="304" width="136" height="24" rx="6" fill="#7c3aed"/>
  <text x="92" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">View repository ↗</text>

  <!-- Right Icon Pills -->
  <rect x="348" y="304" width="24" height="24" rx="6" fill="#23143d" stroke="#4c2d73" stroke-width="1"/>
  <text x="360" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c4b5fd">&lt;/&gt;</text>
  <rect x="378" y="304" width="24" height="24" rx="6" fill="#23143d" stroke="#4c2d73" stroke-width="1"/>
  <text x="390" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">↗</text>
</svg>
